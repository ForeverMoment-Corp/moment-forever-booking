# This workflow is a thin trigger file for booking service.
# It calls the reusable CI workflow stored in the platform repository.
name: Booking CI

on:
  # Start CI on pushes to main and PRs targeting main.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # Cancel older runs for the same branch to save CI time.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-shared-ci:
    # This points to the reusable workflow maintained in the platform repository.
    # If your GitHub owner or repo name differs, update this single line.
    uses: groote123/forever-moment-platform-master/.github/workflows/reusable-ci.yml@main
    with:
      service_name: booking
      dockerhub_repository: groote123/moment-forever-booking
      java_version: "17"
      maven_verify_args: "-B -ntp clean verify"
      dockerfile_path: "Dockerfile"
      push_latest_on_main: true
    secrets:
      # Booking repo secrets are passed to the reusable workflow.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
